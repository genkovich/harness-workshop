name: Check
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
jobs:
  current:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.9.0
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run check
      - run: npm test
  checkpoints:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: start
            pattern: "^00 "
          - ref: step-01-model
            pattern: "^0[0-1] "
          - ref: step-02-messages
            pattern: "^0[0-2] "
          - ref: step-03-function
            pattern: "^0[0-3] "
          - ref: step-04-tools
            pattern: "^0[0-4] "
          - ref: step-05-call
            pattern: "^0[0-5] "
          - ref: step-06-execute
            pattern: "^0[0-6] "
          - ref: step-07-history
            pattern: "^0[0-7] "
          - ref: step-08-loop
            pattern: "^0[0-8] "
          - ref: step-08b-limits
            pattern: "^(0[0-8]|08b) "
          - ref: step-10-context
            pattern: "^(0[0-8]|08b|10) "
          - ref: step-11-skills
            pattern: "^(0[0-8]|08b|1[01]) "
          - ref: step-12-guard
            pattern: "^(0[0-8]|08b|1[0-2]) "
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26.9.0
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run check
      - run: npm test -- --test-name-pattern '${{ matrix.pattern }}'
